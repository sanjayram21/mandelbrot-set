<!doctype html><meta charset=utf-8><title>deep</title><body>
<!-- Opens index.html already zoomed to #cx,cy,scale, for headless deep shots.
     Canvas only: the panel covers a third of the frame. -->
<iframe id="f" width="480" height="360" style="border:0" src="/index.html"></iframe>
<script>
const [cx, cy, scale] = (location.hash.slice(1) || "-0.743643887037151,0.13182590420533,1e-7")
  .split(",").map(Number);
const f = document.getElementById("f");
f.onload = () => {
  const w = f.contentWindow;
  w.S.cx = cx; w.S.cy = cy; w.S.scale = scale;
  w.document.getElementById("panel").hidden = true;
  w.document.getElementById("hud").hidden = true;
  setInterval(() => { w.lastChange = -1e9; }, 50);
};
</script>
