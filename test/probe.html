<!doctype html><meta charset=utf-8><title>probe</title><body>
<iframe id=f width=100 height=80 style="border:0" src="/index.html"></iframe>
<script>
const [cx, cy, scale] = (location.hash.slice(1) || "-0.743643887037151,0.13182590420533,1e-5")
  .split(",").map(Number);
let n = 0;
setTimeout(() => {
  const w = f.contentWindow;
  w.S.cx = cx; w.S.cy = cy; w.S.scale = scale;
  const c = f.contentDocument.getElementById("c"), g = c.getContext("webgl2");
  const raf = w.requestAnimationFrame.bind(w);
  w.requestAnimationFrame = (cb) => raf((t) => {
    cb(t); n++;
    if (n < 2) return;
    const px = new Uint8Array(c.width * c.height * 4);
    g.readPixels(0, 0, c.width, c.height, g.RGBA, g.UNSIGNED_BYTE, px);
    const s = new Set();
    for (let i = 0; i < px.length; i += 4) s.add(px[i] + "," + px[i + 1] + "," + px[i + 2]);
    document.title = "colors=" + s.size + " w=" + c.width + " vp=" + g.getParameter(g.VIEWPORT)[2];
  });
}, 2000);
</script>
