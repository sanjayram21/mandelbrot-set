<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandelbrot</title>
<style>
  :root{
    --bg:#07090c; --ink:#e8edf2; --dim:#7d8894; --line:#1b222b;
    --accent:#ffb454; --panel:rgba(10,13,17,.72);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}

  #hud{position:fixed;top:0;left:0;padding:16px 18px;pointer-events:none;
    font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
    text-shadow:0 1px 6px #000;letter-spacing:.02em}
  #hud b{color:var(--ink);font-weight:500}
  #hud .k{color:#4d5763;display:inline-block;min-width:74px}

  #panel{position:fixed;left:16px;bottom:16px;width:268px;padding:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #panel[hidden],#hud[hidden]{display:none}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 5px}
  .row label{color:var(--dim);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .row output{font:11px ui-monospace,Menlo,monospace;color:var(--accent);font-variant-numeric:tabular-nums}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0 0 10px;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
  input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;
    border-radius:50%;background:var(--accent);border:0;cursor:pointer;box-shadow:0 0 0 3px rgba(255,180,84,.15)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent);cursor:pointer}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,180,84,.3)}

  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  button{font:inherit;font-size:11px;letter-spacing:.03em;color:var(--ink);background:#141a21;
    border:1px solid var(--line);border-radius:7px;padding:7px 4px;cursor:pointer;transition:background .12s,border-color .12s}
  button:hover{background:#1c242e;border-color:#2b3541}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#0b0d10;font-weight:600}

  #swatch{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  #swatch button{height:22px;border-radius:6px;padding:0}
  #swatch button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}

  /* display:grid beats the hidden attribute's display:none, so it needs the guard */
  #err:not([hidden]){position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:var(--dim)}
  @media (max-width:560px){#panel{left:8px;right:8px;bottom:8px;width:auto}}
</style>
</head>
<body>
<canvas id="c" aria-label="Mandelbrot set viewport"></canvas>

<div id="hud" role="status" aria-live="off">
  <div><span class="k">zoom</span><b id="h-zoom">1×</b></div>
  <div><span class="k">center</span><b id="h-center">0, 0</b></div>
  <div><span class="k">iter</span><b id="h-iter">0</b></div>
  <div><span class="k">fps</span><b id="h-fps">0</b></div>
</div>

<div id="panel">
  <div class="row"><label for="s-iter">Base iterations</label><output id="o-iter">128</output></div>
  <input id="s-iter" type="range" min="32" max="1200" step="8" value="128">

  <div class="row"><label for="s-speed">Zoom speed</label><output id="o-speed">1.0×</output></div>
  <input id="s-speed" type="range" min="0.1" max="3" step="0.1" value="1">

  <div class="row"><label for="s-shift">Color drift</label><output id="o-shift">0.00</output></div>
  <input id="s-shift" type="range" min="0" max="1" step="0.01" value="0.25">

  <div id="swatch" role="group" aria-label="Palette">
    <button data-p="0" aria-pressed="true" aria-label="Amber" style="background:linear-gradient(90deg,#2b1a05,#ffb454,#2b6f7a)"></button>
    <button data-p="1" aria-pressed="false" aria-label="Abyss" style="background:linear-gradient(90deg,#0a1430,#4f7fd6,#e8c86a)"></button>
    <button data-p="2" aria-pressed="false" aria-label="Mono" style="background:linear-gradient(90deg,#0b0b0b,#9aa4ae,#f2f5f8)"></button>
    <button data-p="3" aria-pressed="false" aria-label="Ember" style="background:linear-gradient(90deg,#1a0a06,#d1442a,#ffd08a)"></button>
  </div>

  <div class="btns">
    <button id="b-play" aria-pressed="false">Play</button>
    <button id="b-jump">Jump</button>
    <button id="b-reset">Reset</button>
  </div>
  <div class="btns" style="grid-template-columns:1fr 1fr">
    <button id="b-full">Fullscreen</button>
    <button id="b-hide">Hide UI</button>
  </div>
</div>

<div id="err" hidden></div>

<script>
"use strict";

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias:false, depth:false, stencil:false,
  powerPreference:"high-performance", preserveDrawingBuffer:false });

if (!gl) {
  const e = document.getElementById("err");
  e.hidden = false;
  e.textContent = "WebGL2 is required and unavailable in this browser.";
  throw new Error("no webgl2");
}

const VERT = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// Iteration runs in float32 until pixels collide, then switches to double-float
// (df64) pairs. GLSL ES 3.00 has no fma, so two-product uses Veltkamp splitting.
const FRAG = `#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;

uniform vec2  uRes;
uniform vec2  uCenter;      // hi part
uniform vec2  uCenterLo;    // lo part
uniform float uScale;       // view half-height, complex units
uniform float uAspect;
uniform int   uMaxIter;
uniform float uShift;
uniform int   uPalette;
uniform int   uDeep;
uniform vec4  uView;        // drawn rect in canvas fractions, top-down: x, y, w, h
uniform vec2  uOrigin;      // viewport origin in device pixels (gl_FragCoord space)
uniform sampler2D uRef;     // reference orbit, one texel per iteration: rg = Z, ba = dc
uniform int   uRefLen;      // stored iterations; past this the pixel iterates directly

const float SPLIT = 4097.0;  // unused by the mask split, kept for reference

// Mask the low 12 mantissa bits. A Dekker split written as t-(t-a) gets
// reassociated to plain a by the GLSL compiler and the low word silently becomes 0.
vec2 split(float a){ float hi = intBitsToFloat(floatBitsToInt(a) & 0xFFFFF000); return vec2(hi, a - hi); }
// Two-sum without the (s - a) identity: compilers rewrite b - (s - a) to 0,
// which silently drops the whole low word. as.x + bs.x is exact, so its
// difference from s is the rounding error, and the low parts are added after.
// Bitcast barriers: the compiler folds each error term to 0 without them.
// Knuth two-sum, not the split form: when the pixel step is under half an ULP of
// the centre the split form drops it whole (2e-12 for a 1.25e-8 step) and deep
// frames come out flat. Knuth keeps it in b.x - v.
float keep(float x){ return intBitsToFloat(floatBitsToInt(x)); }
vec2 dfAdd(vec2 a, vec2 b){
  float s = keep(a.x + b.x);
  float v = keep(s - a.x);
  float e = (a.x - keep(s - v)) + (b.x - v) + a.y + b.y;
  return vec2(s, e);
}
vec2 dfSub(vec2 a, vec2 b){ return dfAdd(a, vec2(-b.x, -b.y)); }
vec2 dfMul(vec2 a, vec2 b){
  float p = keep(a.x * b.x);
  vec2 as = split(a.x), bs = split(b.x);
  float e = ((as.x * bs.x - p) + as.x * bs.y + as.y * bs.x) + as.y * bs.y;
  e += a.x * b.y + a.y * b.x;
  return vec2(p, e);
}

vec3 palette(float t){
  vec3 a, b, c, d;
  if (uPalette == 0)      { a = vec3(.5);           b = vec3(.5);           c = vec3(1.);            d = vec3(0., .1, .2); }
  else if (uPalette == 1) { a = vec3(.2, .3, .5);   b = vec3(.4, .3, .5);   c = vec3(1., 1., 1.);    d = vec3(.2, .4, .6); }
  else if (uPalette == 2) { a = vec3(.5);           b = vec3(.5);           c = vec3(1.);            d = vec3(0.); }
  else                    { a = vec3(.5, .35, .2); b = vec3(.5, .4, .3);    c = vec3(1., .9, .8);    d = vec3(.1, .2, .3); }
  return a + b * cos(6.2831853 * (c * t + d));
}

vec3 shade(float m, float iter, float mag2){
  // Interior: near-black but tinted by the palette, so a frame that is mostly
  // interior at high depth still reads as a solid shape, not a dead canvas.
  if (iter >= float(uMaxIter)) return palette(uShift + 0.5) * 0.06;
  float nu = log2(max(log2(max(mag2, 1.0001)), 1e-6));
  // 0.28 puts consecutive escape bands a noticeable step apart; 0.14 wrapped
  // the cosine about every 7 iterations and neighbouring pixels came out alike.
  return palette((m + 1.0 - nu) * 0.28 + uShift);
}

void main(){
  // gl_FragCoord is window-based, so the viewport origin comes off first, then
  // the pixel maps into the rect being drawn. y is flipped: canvas runs down.
  vec2 local = (gl_FragCoord.xy - uOrigin) / uRes;
  vec2 frac = uView.xy + local * uView.zw;
  vec2 uv = vec2(frac.x * 2.0 - 1.0, 1.0 - frac.y * 2.0);
  uv.x *= uAspect;
  float m = 0.0, mag2 = 0.0;

  if (uDeep == 0) {
    vec2 c = uCenter + uv * uScale;
    // Interior dropout, Myers' periodicity check. After iterating, z equals z_0:
    // an orbit that returns to a former point is periodic, so it never leaves
    // and the pixel is interior. Successive points are at most |z|^2 + 4 apart,
    // so a bounded orbit must repeat within a handful of steps and a 12-slot
    // ring is enough; the buffer is robbed in order, so a slot is replaced 12
    // iterations later. The tolerance is 0: two float32 points either repeat
    // exactly or did not. A refill by c would cost a double-float add per
    // iteration for depth the shallow loop never reaches; plain c is exact to
    // the pixel.
    // The mark counts passes of the ring, not iterations: bumping it every
    // iteration leaves a slot live for one iteration only and nothing ever hits.
    // It starts at 1 so the zeroed buffer cannot match iteration 0.
    vec2 z = vec2(0.0);
    vec3 g[12];    // x = the mark it belongs to, yz = the point
    float mark = 1.0;
    int victim = 0;
    // GLSL locals are not zeroed: garbage in g[k].x can equal mark at iteration
    // 0 (z = 0,0) and drop out every pixel. The JS mirror uses a zeroed typed
    // array, so only the shader shows it.
    for (int k = 0; k < 12; k++) g[k] = vec3(0.0);
    for (int i = 0; i < 4000; i++) {
      if (i >= uMaxIter) break;
      float a = z.x * z.x, b = z.y * z.y;
      mag2 = a + b;
      if (mag2 > 4.0) break;
      bool hit = false;
      for (int k = 0; k < 12; k++) {
        vec3 s = g[k];
        if (s.x == mark && z.x == s.y && z.y == s.z) hit = true;
      }
      if (hit) { m = float(uMaxIter); break; }
      g[victim] = vec3(mark, z.x, z.y);
      if (++victim == 12) { victim = 0; mark = mark == 255.0 ? 1.0 : mark + 1.0; }
      z = vec2(a - b, 2.0 * z.x * z.y) + c;
      m += 1.0;
    }
  } else {
    // Perturbation. The pixel is Z + d for a reference Z from the texture; only
    // d is iterated, so the pixel step never has to survive the centre's
    // magnitude. d is the pixel's offset from the centre (Z carries the centre
    // itself), and dc is that same offset as the constant term.
    vec2 dcr = vec2(uv.x * uScale, 0.0);
    vec2 dci = vec2(uv.y * uScale, 0.0);
    vec2 dr = dcr, di = dci;
    vec2 zr = vec2(0.0), zi = vec2(0.0);
    // Same dropout as the shallow branch, on the hi words. A pair that repeats
    // differs in the low word by the step's rounding, so the pair compare fires
    // later (measured: 897 iterations to a hit against 496 on the hi word
    // alone); a neighbour is a whole step further apart, which the hi word does
    // resolve. The escape test still needs both words because it compares to 4.
    vec3 g[12];
    float mark = 1.0;
    int victim = 0;
    for (int k = 0; k < 12; k++) g[k] = vec3(0.0);  // see the shallow branch
    for (int i = 0; i < 4000; i++) {
      if (i >= uMaxIter) break;
      vec4 Z = texelFetch(uRef, ivec2(i, 0), 0);
      zr = dfAdd(Z.xy, dr);
      zi = dfAdd(Z.zw, di);
      // |Z + d|^2 expanded: |Z|^2 + 2(Zr*dr + Zi*di) + |d|^2. The cross term is
      // what carries d: at |Z| ~ 3 a float32 sum of the pair rounds d away and
      // every pixel escapes on the reference's own escape time, flat.
      mag2 = dot(Z.xy, Z.xy) + 2.0 * (Z.x * dr.x + Z.z * di.x) + dot(dr, dr);
      if (mag2 > 4.0) break;
      bool hit = false;
      for (int k = 0; k < 12; k++) {
        vec3 s = g[k];
        if (int(s.x) == int(mark) && zr.x == s.y && zi.x == s.z) hit = true;
      }
      if (hit) { m = float(uMaxIter); break; }
      g[victim] = vec3(mark, zr.x, zi.x);
      if (++victim == 12) { victim = 0; mark = mark == 255.0 ? 1.0 : mark + 1.0; }
      // Past the stored reference, or once d outgrows Z, the sum loses the
      // pixel. Fall back to direct iteration from z, which is still good there.
      // Direct iteration needs the full c, not the offset dc.
      if (i + 1 >= uRefLen || (i > 0 && dot(dr, dr) > max(1e-6, dot(Z.xy, Z.xy)))) {
        vec2 cr = dfAdd(vec2(uCenter.x, uCenterLo.x), dcr);
        vec2 ci = dfAdd(vec2(uCenter.y, uCenterLo.y), dci);
        for (int j = i + 1; j < 4000; j++) {
          if (j >= uMaxIter) break;
          mag2 = (zr.x + zr.y) * (zr.x + zr.y) + (zi.x + zi.y) * (zi.x + zi.y);
          if (mag2 > 4.0) break;
          vec2 p = dfMul(zr, zi);
          vec2 q = dfMul(dfAdd(zr, zi), dfAdd(zr, vec2(-zi.x, -zi.y)));
          zi = dfAdd(dfAdd(p, p), ci);
          zr = dfAdd(q, cr);
          m += 1.0;
        }
        break;
      }
      // d' = 2Zd + d^2 + dc, as a complex multiply: real 2Zr*dr - 2Zi*di + ...,
      // imag 2Zr*di + 2Zi*dr + ... . 2Z is doubled as a pair, not on the hi word
      // alone: the low word is what d depends on over thousands of iterations.
      vec2 tr = dfAdd(Z.xy, Z.xy), ti = dfAdd(Z.zw, Z.zw);
      vec2 p = dfMul(dr, di);
      dr = dfAdd(dfAdd(dfSub(dfMul(tr, dr), dfMul(ti, di)),
                        dfSub(dfMul(dr, dr), dfMul(di, di))), dcr);
      di = dfAdd(dfAdd(dfAdd(dfMul(tr, di), dfMul(ti, dr)), dfAdd(p, p)), dci);
      m += 1.0;
    }
  }
  fragColor = vec4(shade(m, m, mag2), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const e = document.getElementById("err");
    e.hidden = false;
    e.textContent = "Shader compile failed: " + log;
    throw new Error(log);
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
for (const n of ["uRes","uCenter","uCenterLo","uScale","uAspect","uMaxIter","uShift","uPalette","uDeep","uView","uOrigin","uRef","uRefLen"])
  U[n] = gl.getUniformLocation(prog, n);

// --- reference orbit -----------------------------------------------------
// Perturbation: the pixel follows a reference orbit Z computed once at the
// centre in BigInt, carrying only its offset d. z = Z + d, so d' = 2Zd + d^2 +
// dc stays small and float32 keeps the pixel. The reference is uploaded as a
// texture, one texel per iteration (rg = Z, ba = dc), and is rebuilt only when
// the centre moves by more than a pixel.
//
// BigInt at 200 bits is ~4x the ~48 a df64 pair carries, so Z is exact where d
// is not. The reference runs 40 past its escape; past that the pixel falls back
// to direct iteration (step 4 replaces the fallback with a chosen reference).
const REF_MAX = 4096, REF_TAIL = 40, REF_BITS = 200n, REF_ONE = 1n << REF_BITS;
const refTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, refTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
let ref = { cx: NaN, cy: NaN, len: 0 };

const refBig = (x) => BigInt(Math.round(x * 2 ** 52)) << (REF_BITS - 52n);

function buildRef(cx, cy) {
  const cxB = refBig(cx), cyB = refBig(cy);
  const px = new Float32Array(REF_MAX * 4);
  let zx = 0n, zy = 0n, n = 0;
  for (; n < REF_MAX; n++) {
    const hx = Number(zx) / 2 ** 200, hy = Number(zy) / 2 ** 200;
    px[n * 4] = Math.fround(hx); px[n * 4 + 1] = hx - Math.fround(hx);
    px[n * 4 + 2] = Math.fround(hy); px[n * 4 + 3] = hy - Math.fround(hy);
    if (zx * zx + zy * zy > 4n * REF_ONE * REF_ONE) break;
    const nx = (zx * zx - zy * zy) / REF_ONE + cxB, ny = (2n * zx * zy) / REF_ONE + cyB;
    zx = nx; zy = ny;
  }
  // 40 past escape, in float64: past escape |Z| squares every step and 200-bit
  // fixed point overflows within ~10. Only the first `esc` are followed: past
  // the escape |Z| is huge and the pair sum with d loses the pixel.
  const esc = n;
  let x = Number(zx) / 2 ** 200, y = Number(zy) / 2 ** 200;
  for (let k = 0; k < REF_TAIL && n < REF_MAX; k++, n++) {
    [x, y] = [x * x - y * y + cx, 2 * x * y + cy];
    px[n * 4] = Math.fround(x); px[n * 4 + 1] = x - Math.fround(x);
    px[n * 4 + 2] = Math.fround(y); px[n * 4 + 3] = y - Math.fround(y);
  }
  gl.bindTexture(gl.TEXTURE_2D, refTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, REF_MAX, 1, 0, gl.RGBA, gl.FLOAT, px);
  ref = { cx, cy, len: esc };
}

// --- state ---------------------------------------------------------------
// The df pair is two float32s, ~45 usable bits; direct iteration dies at 1e-9.
// 1e-8 is inside where a repaired loop still holds, so the clamp sits there
// rather than pretending to 1e-7 (which was flat with the escape bug).
const MIN_SCALE = window.MIN_SCALE = 1e-8;
const SITES = [
  // seahorse valley is 60% interior at 1e-7 and reads as flat; the others are
  // all exterior and keep detail at the floor
  [-0.7746806106269039, -0.137416885603787],
  [-0.743643887037151, 0.13182590420533],
  [ 0.292,             0.0148],            // elephant valley
  [-0.7269,            0.1889],            // san marco
  [-0.16,              1.0405],            // spiral
  [-1.25066,           0.02012],
  [-0.7453,            0.1127],            // double spiral
  [-0.1011,            0.9563],            // south spiral
  [ 0.360240443437614, -0.641313061064803],
];

const S = window.S = {
  cx: -0.6, cy: 0, scale: 1.2,
  iter: 128, speed: 1, shift: 0.25, palette: 0,
  playing: false, deep: 0,
};

let tx = S.cx, ty = S.cy;          // autoplay focus
let legT = 0, legDur = 16, jumpNext = false;
let lastChange = -1e9, lastFrame = performance.now(), fps = 0;

// --- tiles ---------------------------------------------------------------
// The view is covered by frustum-interior tiles, coarse first, fine once the
// view settles. Work is capped per frame and dropped when the camera changes.
const TILE = 32;      // canvas pixels per tile edge at quality 1
let layer = { sig: "", items: [], quality: 0, covered: false };

// Tiles overlapping the view only, at one level. Level 2 tiles are 128 px and
// are what a stale press uses, so covering the canvas early stays cheap.
function tilesFor(level) {
  const q = TILE << level;
  const out = [];
  for (let x = 0; x < W; x += q)
    for (let y = 0; y < H; y += q) {
      const w = Math.min(q, W - x), h = Math.min(q, H - y);
      out.push({ x, y, w, h });
    }
  // Nearest first: the middle of the view settles before the edges.
  const mx = W / 2, my = H / 2;
  out.sort((a, b) => (Math.hypot(b.x + b.w / 2 - mx, b.y + b.h / 2 - my) -
                      Math.hypot(a.x + a.w / 2 - mx, a.y + a.h / 2 - my)));
  out.reverse();  // consumed with pop()
  return out;
}

function drawLayer(tiles) {
  for (const t of tiles) {
    gl.viewport(t.x, t.y, t.w, t.h);
    // y up: the shader's screen y needs the canvas flipped
    // uniform origin is top-down; the shader's y is up, so flip it
    gl.uniform2f(U.uOrigin, t.x, t.y);
    gl.uniform4f(U.uView, t.x / W, t.y / H, t.w / W, t.h / H);
    gl.uniform2f(U.uRes, t.w, t.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

// --- viewport ------------------------------------------------------------
let W = 1, H = 1, dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  H = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  canvas.width = W; canvas.height = H;
  gl.viewport(0, 0, W, H);
  lastChange = performance.now();
}
addEventListener("resize", resize);

// --- interaction ---------------------------------------------------------
function toComplex(px, py) {
  const x = (px / canvas.clientWidth) * 2 - 1;
  const y = 1 - (py / canvas.clientHeight) * 2;
  return [S.cx + x * S.scale * (canvas.clientWidth / canvas.clientHeight), S.cy + y * S.scale];
}

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  stop();
  const [zx, zy] = toComplex(e.clientX, e.clientY);
  const k = Math.exp(e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
  const next = Math.min(8, Math.max(MIN_SCALE, S.scale * k));
  const r = next / S.scale;
  S.cx = zx + (S.cx - zx) * r;
  S.cy = zy + (S.cy - zy) * r;
  S.scale = next;
  lastChange = performance.now();
}, { passive:false });

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  stop();
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("drag");
  drag = { x:e.clientX, y:e.clientY, cx:S.cx, cy:S.cy };
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const h = canvas.clientHeight;
  S.cx = drag.cx - (e.clientX - drag.x) * 2 * S.scale / h;
  S.cy = drag.cy + (e.clientY - drag.y) * 2 * S.scale / h;
  lastChange = performance.now();
});
const endDrag = () => { drag = null; canvas.classList.remove("drag"); };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

canvas.addEventListener("dblclick", (e) => {
  stop();
  const [zx, zy] = toComplex(e.clientX, e.clientY);
  S.cx = zx; S.cy = zy; S.scale *= 0.35;
  lastChange = performance.now();
});

// --- autoplay ------------------------------------------------------------
function randomInView() {
  const asp = canvas.clientWidth / canvas.clientHeight;
  return [S.cx + (Math.random() - 0.5) * S.scale * asp * 1.1,
          S.cy + (Math.random() - 0.5) * S.scale * 1.1];
}

function nextLeg() {
  legT = 0;
  if (jumpNext) {
    const [sx, sy] = SITES[(Math.random() * SITES.length) | 0];
    // start part-way in: the bare site is a blue field, the detail is close in
    S.cx = sx; S.cy = sy; S.scale = 0.004;
    tx = sx + (Math.random() - 0.5) * 2e-4;
    ty = sy + (Math.random() - 0.5) * 2e-4;
  } else {
    [tx, ty] = randomInView();
  }
  jumpNext = !jumpNext;
}

function stop() {
  if (!S.playing) return;
  S.playing = false;
  document.getElementById("b-play").setAttribute("aria-pressed", "false");
  document.getElementById("b-play").textContent = "Play";
}

// --- render --------------------------------------------------------------
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  fps += ((1 / Math.max(dt, 1e-3)) - fps) * 0.08;

  if (S.playing) {
    legT += dt;
    if (legT > legDur) nextLeg();
    const e = 1 - Math.exp(-dt * 0.9);
    S.cx += (tx - S.cx) * e;
    S.cy += (ty - S.cy) * e;
    S.scale = Math.max(MIN_SCALE, S.scale * Math.exp(-S.speed * dt * 0.6));
    // once the floor is reached, sit there for the last stretch instead of
    // grinding into mush and then snapping out on the next leg
    if (S.scale <= MIN_SCALE) legT = Math.max(legT, legDur - 3);
    if (S.shift > 0) S.shift = (S.shift + dt * 0.02) % 1;
    lastChange = now;
  }

  // Pixel budget. Moving gets a coarse pass; settling refines it in tiles. The
  // canvas is resized once per layer, never per tile.
  const still = now - lastChange;
  const quality = still < 220 ? 0.4 : still < 700 ? 1 : 1.6;
  const covered = layer.covered;
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W; canvas.height = H;
    gl.viewport(0, 0, W, H);
  }

  const depth = Math.max(0, -Math.log10(S.scale));
  // Interior pixels need far more iterations as zoom deepens, or every pixel
  // hits the cap and the frame renders one flat colour.
  const maxIter = Math.min(4000, Math.round(S.iter * Math.max(1, 2.5 * Math.pow(depth, 1.4))));

  S.deep = S.scale < 1e-4 ? 1 : 0;
  const hi = Math.fround(S.cx), lo = S.cx - hi;
  const hiY = Math.fround(S.cy), loY = S.cy - hiY;

  gl.uniform2f(U.uCenter, hi, hiY);
  gl.uniform2f(U.uCenterLo, lo, loY);
  gl.uniform1f(U.uScale, S.scale);
  gl.uniform1f(U.uAspect, canvas.clientWidth / canvas.clientHeight);
  gl.uniform1i(U.uMaxIter, maxIter);
  gl.uniform1f(U.uShift, S.shift);
  gl.uniform1i(U.uPalette, S.palette);
  gl.uniform1i(U.uDeep, S.deep);

  // The reference is only rebuilt when the centre moves by more than a pixel,
  // so a pan reuses it and a zoom (which keeps the centre) never rebuilds it.
  // BigInt is slow enough that rebuilding per frame would stutter.
  const step = (2 * S.scale) / H;
  if (S.deep && (!(Math.abs(S.cx - ref.cx) < step) || !(Math.abs(S.cy - ref.cy) < step)))
    buildRef(S.cx, S.cy);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, refTex);
  gl.uniform1i(U.uRef, 0);
  gl.uniform1i(U.uRefLen, ref.len);

  // Cancel: geometry only, so a settled layer's fine tiles survive panning too.
  // Quality is a layer property, so the whole layer is rebuilt when either it or
  // the geometry changes; queued tiles from the old one are dropped.
  const sig = [S.cx, S.cy, S.scale, S.shift, S.palette, S.iter, W, H, S.playing].join();
  if (sig !== layer.sig || quality !== layer.quality) {
    layer = { sig, quality, items: [], covered: false, scale: 0 };
  }

  // A zoom can only get here with a stale layer: cover the canvas at once from
  // the un-pressed tile grid so it never flashes the previous depth, then skip
  // the fine pass this frame.
  if (!layer.covered && (S.scale < layer.scale || !layer.scale)) {
    drawLayer(tilesFor(2));
    layer.covered = true;
    layer.scale = S.scale;
    hud(maxIter);
    requestAnimationFrame(frame);
    return;
  }
  layer.scale = S.scale;

  if (!layer.items.length) layer.items = tilesFor(quality >= 1.6 ? 0 : quality >= 1 ? 1 : 2);

  // Budget: one full canvas of tiles per frame, then yield. Tiles are whole, so
  // a frame does at least one and never more than a screenful.
  let spent = 0;
  const budget = W * H;
  while (layer.items.length && spent < budget) {
    const t = layer.items.pop();
    drawLayer([t]);
    spent += t.w * t.h;
  }

  // Moving: blow up the previous frame at a wider scale, so a zoom draws inward
  // instead of flashing the old depth. Only the canvas area stays valid.
  if (still < 150 && quality < 1) {
    const s = Math.max(S.scale, MIN_SCALE * Math.exp((1 - still / 150) * 3));
    const k = S.scale / s;
    gl.uniform1f(U.uScale, s);
    gl.viewport(0, 0, W, H);
    gl.uniform2f(U.uOrigin, 0, 0);
    gl.uniform2f(U.uRes, W, H);
    // same pixels, drawn smaller: only the k*k centre of it is on screen
    gl.uniform4f(U.uView, (1 - k) / 2, (1 - k) / 2, k, k);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.uniform1f(U.uScale, S.scale);
  }

  hud(maxIter);
  requestAnimationFrame(frame);
}

function hud(maxIter) {
  const z = 1.4 / S.scale;
  document.getElementById("h-zoom").textContent =
    z < 1000 ? z.toFixed(1) + "×" : z.toExponential(1).replace("e+", "e");
  document.getElementById("h-center").textContent =
    S.cx.toFixed(S.scale < 1e-5 ? 15 : 7) + ", " + S.cy.toFixed(S.scale < 1e-5 ? 15 : 7);
  document.getElementById("h-iter").textContent = maxIter;
  document.getElementById("h-fps").textContent = Math.round(fps);
}

// --- controls ------------------------------------------------------------
const $ = (id) => document.getElementById(id);
function bindSlider(id, out, key, fmt) {
  const el = $(id);
  el.addEventListener("input", () => {
    S[key] = parseFloat(el.value);
    $(out).textContent = fmt(S[key]);
    lastChange = performance.now();
  });
}
bindSlider("s-iter", "o-iter", "iter", (v) => v | 0);
bindSlider("s-speed", "o-speed", "speed", (v) => v.toFixed(1) + "×");
bindSlider("s-shift", "o-shift", "shift", (v) => v.toFixed(2));

for (const b of document.querySelectorAll("#swatch button")) {
  b.addEventListener("click", () => {
    S.palette = +b.dataset.p;
    for (const o of document.querySelectorAll("#swatch button"))
      o.setAttribute("aria-pressed", String(o === b));
    lastChange = performance.now();
  });
}

$("b-play").addEventListener("click", () => {
  S.playing = !S.playing;
  $("b-play").setAttribute("aria-pressed", String(S.playing));
  $("b-play").textContent = S.playing ? "Pause" : "Play";
  if (S.playing) { legT = legDur; lastChange = performance.now(); }
});

$("b-jump").addEventListener("click", () => {
  const wasPlaying = S.playing;
  S.playing = false;
  nextLeg();
  if (wasPlaying) S.playing = true;
  lastChange = performance.now();
});

$("b-reset").addEventListener("click", () => {
  stop();
  S.cx = -0.6; S.cy = 0; S.scale = 1.2;
  lastChange = performance.now();
});

$("b-full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
});

$("b-hide").addEventListener("click", () => {
  $("panel").hidden = !$("panel").hidden;
  $("hud").hidden = $("panel").hidden;
});

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); $("b-play").click(); }
  else if (k === "h") $("b-hide").click();
  else if (k === "r") $("b-reset").click();
  else if (k === "n") $("b-jump").click();
  else if (k === "f") $("b-full").click();
});

// Self-check. The old one only exercised dfAdd on constants, which is why the
// doubled-low-word bug and the hi-only escape test both shipped: neither shows
// up unless the whole iteration runs. So run it, in the shader's exact form, and
// compare escape times against a 200-bit BigInt orbit.
for (const v of [0.1, -0.743643887037151, 1e-9, 3.14159265358979]) {
  console.assert(Math.fround(v) + (v - Math.fround(v)) === v, "df split inexact", v);
}
{
  const bits = (x) => new Int32Array(new Float32Array([x]).buffer)[0];
  const fromBits = (i) => new Float32Array(new Int32Array([i]).buffer)[0];
  const f = Math.fround;
  const keep = (x) => fromBits(bits(x));
  const split = (a) => { const h = fromBits(bits(a) & 0xfffff000); return [h, a - h]; };
  const dfAdd = (a, b) => {
    const s = keep(f(a[0] + b[0])), v = keep(f(s - a[0]));
    return [s, f(f(f(f(a[0] - keep(f(s - v))) + f(b[0] - v)) + a[1]) + b[1])];
  };
  const dfMul = (a, b) => {
    const p = keep(f(a[0] * b[0])), as = split(a[0]), bs = split(b[0]);
    let e = f(f(f(as[0] * bs[0] - p) + f(as[0] * bs[1])) + f(as[1] * bs[0]));
    e = f(e + f(as[1] * bs[1]));
    e = f(e + f(f(a[0] * b[1]) + f(a[1] * b[0])));
    return [p, e];
  };
  // shader loop, fixed form: full-pair magnitude and dfAdd(zr, zi)
  const df = (cx, cy, max) => {
    let zr = [0, 0], zi = [0, 0];
    const cr = [f(cx), cx - f(cx)], ci = [f(cy), cy - f(cy)];
    for (let i = 0; i < max; i++) {
      const m = (zr[0] + zr[1]) ** 2 + (zi[0] + zi[1]) ** 2;
      if (m > 4) return i;
      const p = dfMul(zr, zi);
      const d = dfMul(dfAdd(zr, zi), dfAdd(zr, [-zi[0], -zi[1]]));
      zi = dfAdd(dfAdd(p, p), ci);
      zr = dfAdd(d, cr);
    }
    return max;
  };
  // same in exact 200-bit fixed point
  const P = 200n, SC = 1n << P;
  const big = (x) => BigInt(Math.round(x * 2 ** 52)) << (P - 52n);
  const exact = (cx, cy, max) => {
    let zr = 0n, zi = 0n;
    const a0 = big(cx), b0 = big(cy);
    for (let i = 0; i < max; i++) {
      const a = (zr * zr) / SC, b = (zi * zi) / SC;
      if (a + b > 4n * SC) return i;
      zi = (2n * zr * zi) / SC + b0;
      zr = a - b + a0;
    }
    return max;
  };
  // Row of one-pixel steps at 1e-7, scored by how many distinct shaded values it
  // produces. That is the signal a flat frame actually loses; escape counts alone
  // look similar because df64 only carries ~45 bits.
  //
  // Each bug is injected and must measurably flatten the row:
  //   dfHi  - escape on the hi word only (low word computed, then discarded)
  //   dfBad - doubled low word in zr + zi
  // A relative test needs no absolute tolerance, which df64 here would fail.
  const shade = (cx, cy, max, hiOnly, badD) => {
    let zr = [0, 0], zi = [0, 0], m = 0, mag2 = 0;
    const cr = [f(cx), cx - f(cx)], ci = [f(cy), cy - f(cy)];
    for (let i = 0; i < max; i++) {
      mag2 = hiOnly
        ? zr[0] * zr[0] + zi[0] * zi[0]
        : (zr[0] + zr[1]) ** 2 + (zi[0] + zi[1]) ** 2;
      if (mag2 > 4) break;
      const p = dfMul(zr, zi);
      const d = dfMul(badD ? dfAdd([zr[0], 2 * zr[1]], zi) : dfAdd(zr, zi),
                      dfAdd(zr, [-zi[0], -zi[1]]));
      zi = dfAdd(dfAdd(p, p), ci);
      zr = dfAdd(d, cr);
      m++;
    }
    // the shader's normalised iteration count
    return m + 1 - Math.log2(Math.max(Math.log2(Math.max(mag2, 1.0001)), 1e-6));
  };
  // Score a row against the exact orbit: mean |nu - nu_exact|. The fixed loop has
  // to win outright, at 1e-5 where pixels are far enough apart to be meaningful.
  const cx = -0.743643887037151, cy = 0.13182590420533, px = 2e-5 / 480, max = 4000, n = 48;
  const score = (hiOnly, badD) => {
    let t = 0;
    for (let k = -n / 2; k < n / 2; k++) {
      const x = cx + k * px;
      const e = exact(x, cy, max);
      // exact shading value: escaping pixels land near e+1, capped ones past max
      const want = e >= max ? max + 6 : e + 1;
      t += Math.abs(shade(x, cy, max, hiOnly, badD) - want);
    }
    return t / n;
  };
  const good = score(false, false), hi = score(true, false), bad = score(false, true);
  const fails = [];
  // The scoring below runs a JS mirror, so it cannot see the shader text. Assert
  // the two lines themselves; that is what catches a shader-only edit.
  if (!FRAG.includes("dfAdd(zr, zi), dfAdd(zr, vec2(-zi.x, -zi.y))"))
    fails.push("shader lost dfAdd(zr, zi)");
  if (!FRAG.includes("(zr.x + zr.y) * (zr.x + zr.y)"))
    fails.push("shader escapes on the hi word only");
  if (!(good < hi)) fails.push("hi-only escape not caught (" + hi.toFixed(0) + " vs " + good.toFixed(0) + ")");
  if (!(good < bad)) fails.push("doubled low word not caught (" + bad.toFixed(0) + " vs " + good.toFixed(0) + ")");
  window.__checkFailures = fails;
  window.__checkAgree = [good, hi, bad].map(Math.round);
  console.assert(!fails.length, fails.join("; "));
}


resize();
requestAnimationFrame(frame);
</script>
</body>
